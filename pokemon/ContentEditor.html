<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ポケットモンスター版 カード編集</title>
  <style>
    :root{font-family:"Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;color:#eef8ff;background:#071323}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#773b44 0,transparent 28rem),#071323}button,input,textarea,select{font:inherit}button{cursor:pointer}main{max-width:1240px;margin:auto;padding:24px 16px 56px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}h1{font-size:clamp(25px,4vw,40px);margin:4px 0}p{line-height:1.5}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.18em;color:#ffd46e}.muted{color:#a5becd;font-size:13px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px}.panel{border:1px solid #7acde244;border-radius:18px;padding:18px;background:#0d263bdf;box-shadow:0 16px 35px #0005}.generation-list{display:grid;gap:5px}.generation-list button{width:100%;text-align:left;color:#d7ebf6;background:#102d44;border:1px solid #ffffff12;border-radius:10px;padding:9px 11px}.generation-list button.active{border-color:#ffda73;background:#684b29;color:white}.generation-list small{float:right;color:#adcbda}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:800;color:#c7dfeb}input,textarea,select{width:100%;padding:10px 12px;min-height:42px;border-radius:10px;border:1px solid #8cbfd449;color:#fff;background:#061827}textarea{min-height:95px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #ffda73}input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:#ffda73}.check{display:flex;gap:9px;align-items:center;color:#ffe8ac;font-weight:800}.button{border:1px solid #ffc966aa;color:#0d2332;background:#ffda73;border-radius:10px;padding:10px 14px;font-weight:900}.button.secondary{background:#163d59;color:#e6f5ff;border-color:#7acde277}.button.danger{background:#512b35;color:#ffd3da;border-color:#ee727c66}.card-list{height:420px;overflow:auto;border:1px solid #ffffff22;border-radius:12px;background:#061827}.card-list button{display:block;width:100%;padding:10px 12px;background:none;color:#e9f5ff;border:0;border-bottom:1px solid #ffffff12;text-align:left}.card-list button:hover,.card-list button.active{background:#275472}.card-list small{color:#a4bfd0;margin-left:8px}.content-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,360px);gap:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:22px;color:#ffd46e;font-size:13px}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}@media(max-width:850px){.layout,.content-grid{grid-template-columns:1fr}.generation-list{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.generation-list{grid-template-columns:repeat(2,1fr)}header{display:block}}
  </style>
  <script src="./pokemon-data.js"></script>
</head>
<body>
<main>
  <header><div><div class="eyebrow">POKÉDEX CARD DATABASE</div><h1>ポケットモンスター版 カード編集</h1><p class="muted">世代・名前・全国図鑑No.・最終進化判定・ホバーメモを編集できます。</p></div><span id="saveState" class="muted">読み込み中...</span></header>
  <div class="layout">
    <aside class="panel"><div class="eyebrow">GENERATIONS</div><p class="muted">カードの所属世代を選択</p><div id="generations" class="generation-list"></div></aside>
    <section class="panel"><div class="content-grid">
      <div><div class="field"><label for="search">カード検索</label><input id="search" placeholder="名前・No.・メモ" autocomplete="off"></div><div id="count" class="muted"></div><div id="cardList" class="card-list"></div><div class="toolbar"><button id="add" class="button">カードを追加</button><button id="remove" class="button danger">選択カードを削除</button></div></div>
      <div><div class="eyebrow">CARD DETAILS</div><p id="selection" class="muted">カードを選択してください。</p><div class="field"><label for="name">カード名</label><input id="name" maxlength="48"></div><div class="field"><label for="dex">全国図鑑No.（新規カードは空欄可）</label><input id="dex" type="number" min="1" max="9999"></div><div class="field"><label for="types">タイプ（/ 区切り）</label><input id="types" placeholder="例: ほのお / ひこう"></div><label class="check"><input id="finalEvolution" type="checkbox">最終進化・進化しない種族</label><p class="muted">「最終進化のみ」がONのとき、このカードを出現候補に含めます。</p><div class="field"><label for="noteLabel">ホバーメモ見出し</label><input id="noteLabel" maxlength="44"></div><div class="field"><label for="noteText">ホバーメモ本文</label><textarea id="noteText" maxlength="180"></textarea></div><button id="save" class="button">カードを保存</button><p id="message" class="status" role="status"></p></div>
    </div></section>
  </div>
  <section class="panel" style="margin-top:16px"><div class="actions"><label class="button secondary file">JSONを読み込む<input id="importFile" type="file" accept=".json,application/json"></label><button id="export" class="button">content.jsonを書き出す</button><button id="reset" class="button danger">初期状態に戻す</button></div><p class="muted">書き出したcontent.jsonを、このゲームのindex.htmlと同じフォルダへ置くとカード設定が反映されます。ブラウザ内の編集内容は自動保存されます。</p></section>
</main>
<script>
(()=>{'use strict';
  const BASE=window.POKEMON_BASE_DATA, STORAGE='pokemon-coop-editor-v1', KEYS=Object.keys(BASE.vocabulary);
  const $=id=>document.getElementById(id), clone=value=>structuredClone(value);
  let data=clone(BASE), category=KEYS[0], selected=null, query='';
  function clean(value,max=48){return String(value||'').trim().replace(/\s+/g,' ').slice(0,max)}
  function key(group,name){return `${group}::${name}`}
  function persist(){localStorage.setItem(STORAGE,JSON.stringify(data));$('saveState').textContent='自動保存済み'}
  function apply(input){if(input?.schema!==BASE.schema||!input.vocabulary||!input.cardMetadata)throw Error('対応していないカード設定です');const next=clone(BASE),baseForms=new Map(Object.entries(BASE.cardMetadata).filter(([,meta])=>meta.form).map(([cardKey,meta])=>[meta.form,cardKey.split('::').slice(1).join('::')]));next.vocabulary={};next.cardMetadata={};next.cardNotes={};for(const group of KEYS){const names=Array.isArray(input.vocabulary[group])?input.vocabulary[group]:[];next.vocabulary[group]=[];for(const original of names){const oldName=clean(original),oldKey=key(group,oldName),meta=input.cardMetadata[oldKey]||{},form=Number(meta.form)||null;if(form&&!baseForms.has(form))continue;const name=form&&oldName.includes('（メガ')?baseForms.get(form):oldName;if(!name||next.vocabulary[group].includes(name))continue;next.vocabulary[group].push(name);const cardKey=key(group,name);next.cardMetadata[cardKey]={dex:Number(meta.dex)||null,form,final:meta.final===true,types:Array.isArray(meta.types)?meta.types.map(type=>clean(type,20)).filter(Boolean):[]};const note=input.cardNotes?.[oldKey];if(note&&typeof note==='object'&&(note.label||note.text))next.cardNotes[cardKey]={label:clean(note.label,44),text:clean(note.text,180)}}}data=next;category=KEYS[0];selected=null;persist();render()}
  function list(){const all=[];for(const group of KEYS)for(const name of data.vocabulary[group]){const meta=data.cardMetadata[key(group,name)]||{},note=data.cardNotes[key(group,name)]||{};if(!query||[name,meta.dex,note.label,note.text].join(' ').toLocaleLowerCase('ja-JP').includes(query))all.push({group,name})}return query?all:all.filter(entry=>entry.group===category)}
  function render(){const gens=$('generations');gens.replaceChildren();for(const group of KEYS){const button=document.createElement('button'),count=document.createElement('small');button.textContent=`第${group.slice(3)}世代`;count.textContent=data.vocabulary[group].length;button.append(count);button.className=group===category&&!query?'active':'';button.onclick=()=>{category=group;selected=null;query='';$('search').value='';render()};gens.append(button)}const items=list(),cards=$('cardList');cards.replaceChildren();$('count').textContent=`${items.length}件${query?'（全世代検索）':''}`;for(const entry of items){const button=document.createElement('button'),note=document.createElement('small');button.textContent=entry.name;note.textContent=query?`第${entry.group.slice(3)}世代`:'';button.append(note);button.className=selected?.group===entry.group&&selected?.name===entry.name?'active':'';button.onclick=()=>{selected=entry;category=entry.group;render()};cards.append(button)}const current=selected&&data.vocabulary[selected.group].includes(selected.name)?selected:null,meta=current?data.cardMetadata[key(current.group,current.name)]||{}:{},note=current?data.cardNotes[key(current.group,current.name)]||{}:{};$('selection').textContent=current?`第${current.group.slice(3)}世代 / ${current.name}`:`第${category.slice(3)}世代に新規カードを追加`;$('name').value=current?.name||'';$('dex').value=meta.dex||'';$('types').value=(meta.types||[]).join(' / ');$('finalEvolution').checked=meta.final===true;$('noteLabel').value=note.label||'';$('noteText').value=note.text||'';$('remove').disabled=!current}
  function save(){const name=clean($('name').value),dex=$('dex').value?Number($('dex').value):null,types=$('types').value.split(/[\/／,、]/).map(type=>clean(type,20)).filter(Boolean),previous=selected?data.cardMetadata[key(selected.group,selected.name)]:null;if(!name){$('message').textContent='カード名を入力してください。';return}if(dex!==null&&(!Number.isInteger(dex)||dex<1||dex>9999)){$('message').textContent='全国図鑑No.を確認してください。';return}if(types.length>2){$('message').textContent='タイプは2つまで入力してください。';return}if(KEYS.some(group=>data.vocabulary[group].includes(name)&&!(selected?.group===group&&selected?.name===name))){$('message').textContent='同じ名前のカードがすでにあります。';return}if(selected){const old=key(selected.group,selected.name);data.vocabulary[selected.group]=data.vocabulary[selected.group].filter(value=>value!==selected.name);delete data.cardMetadata[old];delete data.cardNotes[old]}data.vocabulary[category].push(name);const cardKey=key(category,name);data.cardMetadata[cardKey]={dex,form:previous?.form||null,final:$('finalEvolution').checked,types};const label=clean($('noteLabel').value,44),text=clean($('noteText').value,180);if(label||text)data.cardNotes[cardKey]={label,text};selected={group:category,name};persist();render();$('message').textContent='保存しました。'}
  $('search').oninput=()=>{query=clean($('search').value,180).toLocaleLowerCase('ja-JP');selected=null;render()};$('add').onclick=()=>{selected=null;render();$('name').focus()};$('save').onclick=save;$('remove').onclick=()=>{if(!selected||!confirm(`「${selected.name}」を削除しますか？`))return;data.vocabulary[selected.group]=data.vocabulary[selected.group].filter(value=>value!==selected.name);delete data.cardMetadata[key(selected.group,selected.name)];delete data.cardNotes[key(selected.group,selected.name)];selected=null;persist();render()};$('reset').onclick=()=>{if(!confirm('すべての編集内容を初期状態に戻しますか？'))return;data=clone(BASE);selected=null;category=KEYS[0];query='';$('search').value='';persist();render()};$('export').onclick=()=>{const output={...data,version:1,name:'ポケットモンスター版 カスタムカード設定',exportedAt:new Date().toISOString()};const url=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='content.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importFile').onchange=async event=>{try{const file=event.target.files?.[0];if(file)apply(JSON.parse(await file.text()));$('message').textContent='読み込みました。'}catch(error){$('message').textContent=error.message||'読み込めませんでした。'}event.target.value=''};
  try{const saved=localStorage.getItem(STORAGE);if(saved)apply(JSON.parse(saved));else render()}catch{data=clone(BASE);render()}$('saveState').textContent='自動保存済み';
})();
</script>
</body>
</html>
